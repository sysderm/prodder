[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prodder"
version = "0.1.0"
description = "A safe activity monitor and prodding service for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
prodder = "prodtop:main"
prodtop = "prodtop:main"

[tool.setuptools]
py-modules = ["prodtop"]

[tool.setuptools.data-files]
"share/prodder" = ["prodtop.example.toml"]
